name: tests

# 仓库内两套测试：零依赖的 Node 内置测试（shadowrocket / merlin / audit-kanban），
# 以及需要 npm 依赖的 audit-workbench 工程版。依赖不同，拆成两个 job 并行跑。
#
# CI 同时覆盖 macOS/Linux 的 POSIX 权限位断言：merlin 测试中的 0o600/0o700 断言
# 在非 Windows 平台会真正生效，与 Windows 本地运行互补（Windows 不支持 POSIX 权限位，
# 该断言自动跳过）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-deps:
    name: zero-dependency tests + links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 显示环境信息
        run: |
          node --version
          git --version
          pwsh --version

      # 显式收集测试文件：`node --test <目录>` 在 Node 22/24 上不会自动发现用例
      # （实测传目录得到 pass 0 / fail 3），所以用 find 列出全部 *.test.* 再交给它。
      # 新增测试文件不需要改 workflow。
      - name: shadowrocket / merlin / audit-kanban 测试
        run: node --test $(find shadowrocket merlin audit-kanban \( -name '*.test.mjs' -o -name '*.test.cjs' \) | sort)

      - name: 文档锚点与相对链接
        run: pwsh -NoProfile -File scripts/check-links.ps1

      - name: 空白字符检查
        run: git diff --check

  workbench:
    name: audit-workbench (test / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-workbench
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit-workbench/package-lock.json

      # 自动测试的另一半依赖 Python 3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 显示环境信息
        run: |
          node --version
          npm --version
          python3 --version

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 类型检查
        run: npm run typecheck

      - name: 构建（静态导出）
        run: npm run build

  # windows-fresh-setup is Windows-only, so its checks cannot run in the ubuntu jobs above.
  # This job runs the parts that must hold on a clean Windows runner:
  #   * both PowerShell hosts parse every script (5.1 is what scheduled tasks use),
  #   * every script stays ASCII-only (5.1 decodes BOM-less files as ANSI),
  #   * the numbers quoted in the docs still match the files,
  #   * the bootstrap dry run exits 0 without invoking setup.ps1 (the P0 regression).
  windows-fresh-setup:
    name: windows-fresh-setup static checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          git --version

      - name: Script hygiene (dual-host parse + ASCII-only)
        shell: pwsh
        run: ./skills/windows-fresh-setup/scripts/check-script-hygiene.ps1

      - name: Pure-function self test
        shell: pwsh
        run: ./skills/windows-fresh-setup/scripts/test-tune-core.ps1

      - name: Documented numbers match the files
        shell: pwsh
        run: ./skills/windows-fresh-setup/scripts/check-counts.ps1

      - name: Repository links and anchors
        shell: pwsh
        run: ./scripts/check-links.ps1

      - name: Bootstrap dry run must not hand over to setup.ps1
        shell: pwsh
        run: |
          # *>&1 is required: the script reports through Write-Host (information stream),
          # which a plain 2>&1 capture does not keep - the marker check below would fail.
          $out = & ./skills/windows-fresh-setup/scripts/bootstrap.ps1 -DryRun *>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "bootstrap -DryRun exited $LASTEXITCODE" }
          if ($out -notmatch 'dry run: nothing was downloaded') { throw "dry-run marker missing from output" }
          if ($out -match '--- check|--- dev|--- tune') { throw "dry run started a setup phase" }
          Write-Host 'bootstrap -DryRun: exit 0, no setup phase ran'

      - name: PowerShell 5.1 parse of the entry points
        shell: powershell
        run: |
          $files = @(
            'skills/windows-fresh-setup/scripts/setup.ps1',
            'skills/windows-fresh-setup/scripts/verify-env.ps1',
            'skills/windows-fresh-setup/scripts/bootstrap.ps1',
            'skills/windows-fresh-setup/scripts/check-counts.ps1',
            'skills/windows-fresh-setup/scripts/install-portable.ps1',
            'skills/windows-fresh-setup/scripts/clean-orphan-associations.ps1',
            'skills/windows-fresh-setup/scripts/diagnose-ime.ps1',
            'skills/windows-fresh-setup/scripts/setup-langs.ps1'
          )
          $bad = 0
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { Write-Host "FAIL $f : $($errors[0].Message)"; $bad++ }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "5.1 parse ok: $($files.Count) file(s)"
