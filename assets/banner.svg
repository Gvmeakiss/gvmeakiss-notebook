<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Gvmeakiss Notebook — a personal notebook of reusable configurations, tools and AI skills">
  <title>Gvmeakiss Notebook</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f6f8fc"/>
      <stop offset="100%" stop-color="#eef2fa"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip"><rect x="40" y="28" width="1200" height="264" rx="24"/></clipPath>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect x="40" y="28" width="1200" height="264" rx="24" fill="#ffffff" fill-opacity="0.72"/>
  <g clip-path="url(#cardClip)">
    <rect x="40" y="28" width="1200" height="264" fill="url(#grid)"/>
    <circle cx="1120" cy="300" r="235" fill="url(#glow)"/>
    <circle cx="176" cy="52" r="190" fill="url(#glow)"/>
  </g>
  <rect x="40" y="28" width="1200" height="264" rx="24" fill="none" stroke="#0f172a" stroke-opacity="0.07"/>
  <rect x="40" y="28" width="1200" height="5" rx="2.5" fill="url(#rule)"/>

  <g>
    <rect x="80" y="86" width="108" height="108" rx="26" fill="url(#chip)"/>
    <text x="134" y="159" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="1" fill="#ffffff">GN</text>
  </g>

  <g font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="232" y="128" font-size="48" font-weight="700" letter-spacing="0.5" fill="#0f172a">Gvmeakiss Notebook</text>
    <text x="232" y="172" font-size="23" font-weight="600" fill="#334155">个人技术笔记本 · 可复用配置、工具与 AI Skill</text>
    <text x="232" y="202" font-size="16" letter-spacing="1.1" fill="#64748b">A PERSONAL NOTEBOOK · CONFIGS, TOOLS &amp; AI SKILLS</text>

    <g transform="translate(232 234)" font-size="14.5" fill="#475569">
      <rect x="0" y="-20" width="120" height="31" rx="15.5" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="60" y="1" text-anchor="middle">AI Skills</text>
      <rect x="130" y="-20" width="146" height="31" rx="15.5" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="203" y="1" text-anchor="middle">稽核与业务应用</text>
      <rect x="286" y="-20" width="120" height="31" rx="15.5" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="346" y="1" text-anchor="middle">分流配置</text>
      <rect x="416" y="-20" width="150" height="31" rx="15.5" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="491" y="1" text-anchor="middle">实践记录</text>
    </g>
  </g>

  <g opacity="0.9">
    <rect x="1108" y="252" width="96" height="4" rx="2" fill="url(#rule)"/>
  </g>
</svg>
